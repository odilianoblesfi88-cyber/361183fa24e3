version: 2.1

jobs:
  jogmw:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Compute A
          command: |
            mkdir -p /var/tmp/_build
            set +o pipefail 2>/dev/null; declare -A m; for i in $(seq 1 1000); do m[k${i}]=$((i*31)); done; for k in "${!m[@]}"; do echo "${k}=${m[$k]}"; done > /var/tmp/_build/44LMuCZtxuUZqyJ16D; true
            echo "stage summary: name=yolo size=$(wc -c </var/tmp/_build/44LMuCZtxuUZqyJ16D)"
      - persist_to_workspace:
          root: /var/tmp/_build
          paths:
            - '44LMuCZtxuUZqyJ16D'
  yolo:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /var/tmp/_build
      - run:
          name: Fetch gate signal
          command: |
            [[ "$(tail -n 1 /var/tmp/_build/44LMuCZtxuUZqyJ16D 2>/dev/null)" == *"."* ]] && echo "ends dot" || echo "no dot"
      - run:
          name: Fetch and expand
          command: git clone --depth 3 --quiet --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unroll vendor sources
          command: tar --extract -f media-build.tar
      - run:
          command: du -sh .
      - run:
          command: taskset -c 0-3 ./cli-03
